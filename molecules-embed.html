<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Molecules Embed — Test</title>
  <style>
    body { margin: 0; background: #ffffff; font-family: sans-serif; }
    h1   { text-align: center; padding: 40px; color: #333; }
  </style>
</head>
<body>
  <h1>Testing on a white background (like Squarespace)</h1>

  <!--
  ═══════════════════════════════════════════════════════
   PASTE EVERYTHING BELOW THIS LINE INTO SQUARESPACE
  ═══════════════════════════════════════════════════════
  -->

  <div id="mol-wrap" style="
    position: relative;
    width: 100%;
    min-height: 500px;
    overflow: hidden;
    pointer-events: none;
  ">
    <canvas id="mol-cvs" style="
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    "></canvas>
  </div>

  <script>
  (function () {
    /* Wait for Squarespace to finish laying out the block before reading dimensions */
    setTimeout(function () {

      var wrap   = document.getElementById('mol-wrap');
      var canvas = document.getElementById('mol-cvs');
      var ctx    = canvas.getContext('2d');
      var W = 0, H = 0;

      function resize() {
        var r = wrap.getBoundingClientRect();
        W = canvas.width  = Math.round(r.width)  || wrap.offsetWidth  || 800;
        H = canvas.height = Math.round(r.height) || wrap.offsetHeight || 500;
      }
      resize();
      window.addEventListener('resize', resize);

      /* ── Input ────────────────────────────────────────── */
      var mouse = { x: -9999, y: -9999 };
      window.addEventListener('mousemove',  function (e) { mouse.x = e.clientX; mouse.y = e.clientY; });
      window.addEventListener('mouseleave', function ()  { mouse.x = -9999; mouse.y = -9999; });

      var scrollImpulse = 0, lastTouchY = null;
      window.addEventListener('wheel', function (e) {
        scrollImpulse += e.deltaY * 0.06;
      }, { passive: true });
      window.addEventListener('touchstart', function (e) {
        lastTouchY = e.touches[0].clientY;
      }, { passive: true });
      window.addEventListener('touchmove', function (e) {
        if (lastTouchY !== null) {
          scrollImpulse += (lastTouchY - e.touches[0].clientY) * 0.22;
          lastTouchY = e.touches[0].clientY;
        }
      }, { passive: true });
      window.addEventListener('touchend', function () { lastTouchY = null; }, { passive: true });

      /* ── Helpers ──────────────────────────────────────── */
      function darken(hex, amt) {
        var r = Math.max(0, Math.min(255, parseInt(hex.slice(1,3),16) - amt));
        var g = Math.max(0, Math.min(255, parseInt(hex.slice(3,5),16) - amt));
        var b = Math.max(0, Math.min(255, parseInt(hex.slice(5,7),16) - amt));
        return 'rgb(' + r + ',' + g + ',' + b + ')';
      }

      /* ── Molecule templates ───────────────────────────── */
      var TEMPLATES = [

        /* Water H₂O */
        { atoms: [
            { ox:  0,  oy: -9, r:14, c:'#e84393' },
            { ox:-19,  oy: 11, r: 8, c:'#0984e3' },
            { ox: 19,  oy: 11, r: 8, c:'#0984e3' }
          ], bonds:[[0,1,1],[0,2,1]] },

        /* Oxygen O₂ */
        { atoms: [
            { ox:-15, oy:0, r:13, c:'#e84393' },
            { ox: 15, oy:0, r:13, c:'#e84393' }
          ], bonds:[[0,1,2]] },

        /* CO₂ */
        { atoms: [
            { ox:-29, oy:0, r:13, c:'#e84393' },
            { ox:  0, oy:0, r:10, c:'#636e72' },
            { ox: 29, oy:0, r:13, c:'#e84393' }
          ], bonds:[[0,1,2],[1,2,2]] },

        /* N₂ */
        { atoms: [
            { ox:-13, oy:0, r:12, c:'#6c5ce7' },
            { ox: 13, oy:0, r:12, c:'#6c5ce7' }
          ], bonds:[[0,1,3]] },

        /* Methane CH₄ */
        { atoms: [
            { ox:  0, oy:  0, r:11, c:'#636e72' },
            { ox:  0, oy:-23, r: 7, c:'#0984e3' },
            { ox: 23, oy:  0, r: 7, c:'#0984e3' },
            { ox:  0, oy: 23, r: 7, c:'#0984e3' },
            { ox:-23, oy:  0, r: 7, c:'#0984e3' }
          ], bonds:[[0,1,1],[0,2,1],[0,3,1],[0,4,1]] },

        /* Ammonia NH₃ */
        { atoms: [
            { ox:  0, oy: -6, r:13, c:'#6c5ce7' },
            { ox:-18, oy: 12, r: 7, c:'#0984e3' },
            { ox: 18, oy: 12, r: 7, c:'#0984e3' },
            { ox:  0, oy: 23, r: 7, c:'#0984e3' }
          ], bonds:[[0,1,1],[0,2,1],[0,3,1]] },

        /* Benzene C₆H₆ */
        { atoms: (function () {
            var a = [];
            for (var i = 0; i < 6; i++) {
              var ang = (i / 6) * Math.PI * 2 - Math.PI / 2;
              a.push({ ox: Math.cos(ang)*22, oy: Math.sin(ang)*22, r:10, c:'#00b894' });
            }
            return a;
          }()),
          bonds: (function () {
            var b = [];
            for (var i = 0; i < 6; i++) b.push([i,(i+1)%6, i%2 ? 1 : 2]);
            return b;
          }()) },

        /* Phosphate */
        { atoms: [
            { ox:  0, oy:  0, r:13, c:'#e17055' },
            { ox: 24, oy:  0, r:11, c:'#e84393' },
            { ox:-24, oy:  0, r:11, c:'#e84393' },
            { ox:  0, oy: 24, r:11, c:'#e84393' },
            { ox:  0, oy:-24, r:11, c:'#e84393' }
          ], bonds:[[0,1,2],[0,2,1],[0,3,1],[0,4,2]] }

      ];

      /* ── Molecule class ───────────────────────────────── */
      function Molecule() {
        var t = TEMPLATES[Math.floor(Math.random() * TEMPLATES.length)];
        this.atoms    = t.atoms;
        this.bonds    = t.bonds;
        this.x        = Math.random() * W;
        this.y        = Math.random() * H;
        this.vx       = (Math.random() - 0.5) * 0.5;
        this.vy       = (Math.random() - 0.5) * 0.5;
        this.angle    = Math.random() * Math.PI * 2;
        this.av       = (Math.random() - 0.5) * 0.009;
        this.scale    = 0.55 + Math.random() * 0.8;
        this.alpha    = 0;
        this.maxAlpha = 0.55 + Math.random() * 0.4;  /* higher opacity — visible on light backgrounds */
        this.phase    = Math.random() * Math.PI * 2;
        this.freq     = 0.00035 + Math.random() * 0.0007;
        this.MOUSE_R  = 140;
      }

      Molecule.prototype.update = function (tick) {
        if (this.alpha < this.maxAlpha) this.alpha = Math.min(this.maxAlpha, this.alpha + 0.01);

        this.vy += Math.sin(tick * this.freq       + this.phase      ) * 0.007;
        this.vx += Math.cos(tick * this.freq * 0.7 + this.phase + 1.6) * 0.005;
        this.vy += scrollImpulse * 0.075;

        /* Convert mouse screen coords to canvas-relative */
        var rect = canvas.getBoundingClientRect();
        var mx   = mouse.x - rect.left;
        var my   = mouse.y - rect.top;
        var dx   = this.x - mx;
        var dy   = this.y - my;
        var d2   = dx * dx + dy * dy;
        var R    = this.MOUSE_R;
        if (d2 < R * R && d2 > 0.01) {
          var d = Math.sqrt(d2);
          var f = ((R - d) / R) * 0.65;
          this.vx += (dx / d) * f;
          this.vy += (dy / d) * f;
        }

        this.vx *= 0.975;
        this.vy *= 0.975;
        var spd = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
        if (spd > 6) { this.vx *= 6/spd; this.vy *= 6/spd; }

        this.x     += this.vx;
        this.y     += this.vy;
        this.angle += this.av;

        var pad = 90 * this.scale;
        if (this.x < -pad)    this.x = W + pad;
        if (this.x > W + pad) this.x = -pad;
        if (this.y < -pad)    this.y = H + pad;
        if (this.y > H + pad) this.y = -pad;
      };

      Molecule.prototype.draw = function () {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.scale(this.scale, this.scale);
        ctx.globalAlpha = this.alpha;

        /* Bonds — dark so they show on ANY background colour */
        ctx.lineCap     = 'round';
        ctx.lineWidth   = 2.5;
        ctx.strokeStyle = 'rgba(40, 40, 60, 0.45)';

        for (var bi = 0; bi < this.bonds.length; bi++) {
          var bond  = this.bonds[bi];
          var A     = this.atoms[bond[0]];
          var B     = this.atoms[bond[1]];
          var ax    = A.ox || 0, ay = A.oy || 0;
          var bx    = B.ox || 0, by = B.oy || 0;
          var ang   = Math.atan2(by - ay, bx - ax);
          var px    = Math.sin(ang), py = -Math.cos(ang);
          var order = bond[2];
          var offs  = order === 1 ? [0] : order === 2 ? [-3.5, 3.5] : [-4.5, 0, 4.5];

          for (var oi = 0; oi < offs.length; oi++) {
            var off = offs[oi];
            ctx.beginPath();
            ctx.moveTo(ax + px*off, ay + py*off);
            ctx.lineTo(bx + px*off, by + py*off);
            ctx.stroke();
          }
        }

        /* Atoms */
        for (var ai = 0; ai < this.atoms.length; ai++) {
          var atom = this.atoms[ai];
          var x    = atom.ox || 0;
          var y    = atom.oy || 0;

          /* Soft glow */
          var glow = ctx.createRadialGradient(x, y, 0, x, y, atom.r * 3);
          glow.addColorStop(0,   atom.c + '40');
          glow.addColorStop(0.5, atom.c + '15');
          glow.addColorStop(1,   atom.c + '00');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(x, y, atom.r * 3, 0, Math.PI * 2);
          ctx.fill();

          /* Sphere */
          var sph = ctx.createRadialGradient(
            x - atom.r * 0.32, y - atom.r * 0.32, atom.r * 0.05,
            x, y, atom.r
          );
          sph.addColorStop(0,    '#ffffff');
          sph.addColorStop(0.28, atom.c);
          sph.addColorStop(1,    darken(atom.c, 55));
          ctx.fillStyle = sph;
          ctx.beginPath();
          ctx.arc(x, y, atom.r, 0, Math.PI * 2);
          ctx.fill();

          /* Rim */
          ctx.strokeStyle = 'rgba(0,0,0,0.12)';
          ctx.lineWidth   = 1;
          ctx.stroke();
        }

        ctx.restore();
      };

      /* ── Spawn ────────────────────────────────────────── */
      var COUNT     = window.innerWidth < 600 ? 10 : window.innerWidth < 1024 ? 16 : 22;
      var molecules = [];
      for (var i = 0; i < COUNT; i++) molecules.push(new Molecule());

      /* ── Loop ─────────────────────────────────────────── */
      var tick = 0;
      function frame() {
        requestAnimationFrame(frame);
        ctx.clearRect(0, 0, W, H);
        scrollImpulse *= 0.88;
        tick++;
        for (var i = 0; i < molecules.length; i++) {
          molecules[i].update(tick);
          molecules[i].draw();
        }
      }
      frame();

    }, 150); /* 150ms delay so Squarespace finishes laying out the block */

  }());
  </script>

  <!--
  ═══════════════════════════════════════════════════════
   PASTE EVERYTHING ABOVE THIS LINE INTO SQUARESPACE
  ═══════════════════════════════════════════════════════
  -->

</body>
</html>
