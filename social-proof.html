     AtReef Social Proof Closer — drop into any section

<style>
#atreef-sp,
#atreef-sp * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

#atreef-sp {
  display: inline-flex;
  align-items: center;
  gap: 0;
  padding: 9px 18px 9px 9px;
  background: #ffffff;
  border: 1px solid rgba(53, 77, 67, 0.14);
  border-radius: 999px;
  box-shadow:
    0 2px 12px rgba(53, 77, 67, 0.08),
    0 1px 3px rgba(0, 0, 0, 0.05);
  font-family: inherit;
}

/* Overlapping avatars */
.asp-avatars {
  display: flex;
  align-items: center;
  margin-right: 10px;
}

.asp-avatars img {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid #ffffff;
  object-fit: cover;
  display: block;
  flex-shrink: 0;
}

.asp-avatars img + img { margin-left: -9px; }

/* Thin sage divider */
.asp-sep {
  width: 1px;
  height: 24px;
  background: rgba(53, 77, 67, 0.14);
  margin: 0 12px;
  flex-shrink: 0;
}

/* Right block: stars + text */
.asp-right {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

/* 5 gold stars */
.asp-stars {
  display: flex;
  align-items: center;
  gap: 1.5px;
}

.asp-stars svg {
  width: 11px;
  height: 11px;
  flex-shrink: 0;
}

/* Text */
.asp-text {
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: #3D3936;
  line-height: 1;
  white-space: nowrap;
  font-family: inherit;
}

.asp-text strong {
  color: #1A1917;
  font-weight: 600;
}
</style>

<div id="atreef-sp">

  <!-- Avatars -->
  <div class="asp-avatars" aria-hidden="true">
    <img src="https://i.pravatar.cc/60?img=47" alt="" width="30" height="30">
    <img src="https://i.pravatar.cc/60?img=23" alt="" width="30" height="30">
    <img src="https://i.pravatar.cc/60?img=55" alt="" width="30" height="30">
  </div>

  <!-- Divider -->
  <div class="asp-sep" aria-hidden="true"></div>

  <!-- Stars + label -->
  <div class="asp-right">
